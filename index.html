<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<link rel="manifest" href="/manifest.webmanifest">
<title>Jarvis 2</title>
<style>
:root{--bg:#0b0f14;--panel:#121821;--line:#202a36;--text:#eef4fb;--muted:#8ea0b4;--btn:#eaf1f8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.app{max-width:780px;margin:auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 70px)}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{font-size:24px;font-weight:800}.sub,.small,.label,.status{color:var(--muted)}.sub,.small,.label,.status{font-size:12px}.sub{margin-top:4px}.dot{width:9px;height:9px;border-radius:50%;background:#8be0b0;box-shadow:0 0 12px #8be0b0}
.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tab{white-space:nowrap;background:#151c25;border:1px solid var(--line);color:#cbd6e3;padding:10px 14px;border-radius:999px;font-weight:700}.tab.active{background:#eaf1f8;color:#0b0f14}
.card{background:#111821;border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
textarea,input,select{width:100%;border:1px solid #263241;background:#0a0f15;color:var(--text);border-radius:15px;padding:14px;font-size:16px;outline:none}
textarea{min-height:130px;resize:vertical;line-height:1.55}.tall{min-height:180px}
button{border:0;border-radius:15px;padding:13px 16px;font-size:15px;font-weight:750}.primary{width:100%;margin-top:10px;background:var(--btn);color:#0b0f14}.secondary{background:#1b2430;color:#dce7f3;border:1px solid #283646}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.wide{grid-column:1/-1}.row{display:flex;gap:9px}.row>*{flex:1}.hidden{display:none!important}
.label{margin:0 0 10px 2px}.status{min-height:20px;margin-top:9px}.analysis,.planpre{white-space:pre-wrap;line-height:1.7}.analysis{font-size:15px}.planpre{font-size:13px;color:#d9e3ee}
.item{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.item:first-child{border-top:0;padding-top:0;margin-top:0}.time{font-size:11px;color:#718297;margin-bottom:6px}.entry{font-size:14px;line-height:1.55}
.plan{border:1px solid #263242;border-radius:18px;padding:14px;margin-top:12px;background:#0d131a}.plan h3{margin:0 0 8px;font-size:17px}.bar{height:8px;background:#1d2631;border-radius:999px;overflow:hidden}.bar>div{height:100%;background:#dfe9f5}.metric{font-size:12px;color:#a8b6c7;margin:8px 0}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#1e2834;color:#bcc9d8;font-size:11px;margin:5px 5px 0 0}
h2{font-size:18px;margin:0 0 12px}
@media(max-width:600px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.row{flex-direction:column}}
</style>
</head>
<body>
<div class="app">
<header><div><div class="brand">JARVIS 2</div><div class="sub">分析 · 记忆 · 计划 · 推进</div></div><div class="dot"></div></header>
<div class="tabs">
<button class="tab active" data-tab="chat">管家</button>
<button class="tab" data-tab="plans">长期计划</button>
<button class="tab" data-tab="memory">记忆</button>
<button class="tab" data-tab="settings">档案</button>
</div>

<section id="tab-chat">
<div class="card">
<div class="label">告诉我发生了什么，或者直接问“我该怎么办”</div>
<textarea id="input" class="tall" placeholder="例如：我最近总想开始健身，但每次坚持三四天就停了。&#10;&#10;也可以直接写：今天跑了3公里，感觉状态不错。"></textarea>
<button class="primary" id="send">告诉贾维斯</button>
<div id="status" class="status"></div>
</div>
<div class="card hidden" id="pendingCard">
<div class="label">需要你补充的信息</div>
<div id="pendingBox"></div>
<textarea id="pendingReply" style="min-height:110px;margin-top:10px" placeholder="按顺序回答上面的问题，想到多少写多少。"></textarea>
<button class="primary" id="submitPending">补充信息并继续分析</button>
<div id="pendingStatus" class="status"></div>
</div>
<div class="card hidden" id="answerCard"><div class="label">Jarvis 的判断</div><div id="answer" class="analysis"></div></div>
<div class="card"><div class="label">最近记录</div><div id="history"></div></div>
</section>

<section id="tab-plans" class="hidden">
<div class="card">
<h2>创建长期计划</h2>
<div class="small" style="margin-bottom:12px">适合健身、读书、考证、存钱、学习技能、项目推进等。会自动拆成阶段、清单、里程碑、复盘规则和进度指标。</div>
<div class="grid">
<input id="planGoal" class="wide" placeholder="目标，例如：12周建立稳定健身习惯">
<textarea id="planCurrent" placeholder="当前情况：基础、已做到什么、主要问题"></textarea>
<textarea id="planConstraints" placeholder="限制：时间、预算、身体、工作等"></textarea>
<input id="planDeadline" placeholder="截止日期（可留空）">
<input id="planTime" placeholder="可投入时间，例如 每周4次×45分钟">
<select id="planPace"><option>稳健</option><option>积极</option><option>轻量</option></select>
<input id="planMetric" placeholder="最在意的结果指标（可留空）">
</div>
<button class="primary" id="createPlan">生成完整计划</button>
<div id="planStatus" class="status"></div>
</div>
<div class="card"><div class="label">进行中的计划</div><div id="plansList"></div></div>
</section>

<section id="tab-memory" class="hidden">
<div class="card">
<h2>分层记忆</h2>
<div class="small">分析时自动组合：长期档案、最近记录、相关旧记录、阶段总结和活跃计划。复杂问题读取更多历史，简单问题读取更少。</div>
<div class="row" style="margin-top:12px">
<button class="secondary" id="refresh7">更新7天总结</button>
<button class="secondary" id="refresh30">更新30天总结</button>
<button class="secondary" id="refresh90">更新90天总结</button>
</div>
<div id="memoryStatus" class="status"></div>
</div>
<div class="card"><div class="label">阶段总结</div><div id="summaries"></div></div>
<div class="row"><button class="secondary" id="exportBtn">导出全部备份</button><button class="secondary" id="importBtn">导入备份</button></div>
<input id="importFile" type="file" accept="application/json" class="hidden">
</section>

<section id="tab-settings" class="hidden">
<div class="card">
<h2>长期档案</h2>
<div class="grid">
<input id="name" placeholder="称呼"><input id="age" placeholder="年龄">
<input id="sex" placeholder="性别"><input id="height" placeholder="身高">
<input id="weight" placeholder="体重"><input id="job" placeholder="职业">
<input class="wide" id="schedule" placeholder="作息 / 上下班时间">
<input class="wide" id="goals" placeholder="目前最重要的目标">
<input class="wide" id="values" placeholder="重要偏好 / 价值排序（可留空）">
<textarea class="wide" id="notes" placeholder="其他长期背景：重要关系、长期困扰、生活约束等"></textarea>
</div>
<button class="primary" id="saveProfile">保存长期档案</button>
<div id="profileStatus" class="status"></div>
</div>
</section>

<div class="small" style="margin-top:14px">原始数据默认保存在当前设备本地。AI分析时，只发送本次所需的档案、总结、计划和筛选出的历史。请定期导出备份。</div>
</div>

<script>
const K={profile:'jarvis3_profile',entries:'jarvis3_entries',plans:'jarvis3_plans',summaries:'jarvis3_summaries',pending:'jarvis3_pending'};
const $=s=>document.querySelector(s),get=(k,f)=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f))}catch{return f}},set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const profile=()=>get(K.profile,{}),entries=()=>get(K.entries,[]),plans=()=>get(K.plans,[]),summaries=()=>get(K.summaries,[]),pending=()=>get(K.pending,[]);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('[id^="tab-"]').forEach(x=>x.classList.add('hidden'));$('#tab-'+b.dataset.tab).classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b))});
function grams(s){s=(s||'').toLowerCase().replace(/\s+/g,'').replace(/[，。！？、,.!?;；:："'“”‘’（）()\[\]{}]/g,'');const z=new Set();for(let i=0;i<s.length-1;i++)z.add(s.slice(i,i+2));return z}
function modeFor(t){if(/人生|这几年|两年|三年|过去一年|长期变化|半年/.test(t))return'life';if(/最近|这个月|几周|为什么|越来越|反复|总是|经常|趋势|规律/.test(t))return'deep';return'quick'}
function selectHistory(text){const all=entries(),mode=modeFor(text),rn=mode==='quick'?20:mode==='deep'?35:50,relN=mode==='quick'?30:mode==='deep'?80:140,recent=all.slice(-rn),ids=new Set(recent.map(x=>x.id)),q=grams(text);const relevant=all.filter(x=>!ids.has(x.id)).map(e=>{const eg=grams(e.text);let c=0;q.forEach(g=>{if(eg.has(g))c++});const age=(Date.now()-new Date(e.time))/86400000;return[c*4+Math.max(0,8-age/10)+(e.important?8:0),e]}).sort((a,b)=>b[0]-a[0]).filter(x=>x[0]>1).slice(0,relN).map(x=>x[1]);return{mode,recent,relevant}}
async function api(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw new Error(d.error||'请求失败');return d}
function renderHistory(){const box=$('#history'),a=entries().slice().reverse().slice(0,30);box.innerHTML=a.length?a.map(e=>`<div class="item"><div class="time">${new Date(e.time).toLocaleString()}</div><div class="entry">${esc(e.text)}</div>${e.analysis?`<details><summary class="small">查看分析</summary><div class="analysis" style="font-size:12px">${esc(e.analysis)}</div></details>`:''}</div>`).join(''):'<div class="small">还没有记录。</div>'}
function planText(p){const s=p.spec||{};let o='';if(s.success_metrics?.length)o+='成功标准：\n- '+s.success_metrics.join('\n- ')+'\n\n';if(s.milestones?.length){o+='阶段里程碑：\n';for(const m of s.milestones){o+=`\n${m.period||''} ${m.objective||''}\n`;if(m.checklist)o+='- '+m.checklist.join('\n- ')+'\n'}}if(s.weekly_template?.length){o+='\n每周模板：\n';for(const d of s.weekly_template)o+=`\n${d.day||''}：${(d.tasks||[]).map(t=>typeof t==='string'?t:t.task).join('；')}`}if(s.first_7_days?.length){o+='\n\n前7天：\n';for(const d of s.first_7_days)o+=`${d.day||''}：${(d.tasks||[]).map(t=>typeof t==='string'?t:t.task).join('；')}\n`}if(s.review_rules?.length)o+='\n复盘规则：\n- '+s.review_rules.join('\n- ');return o}
function renderPlans(){const box=$('#plansList'),a=plans().slice().reverse();box.innerHTML=a.length?a.map(p=>`<div class="plan" data-id="${p.id}"><h3>${esc(p.title||p.goal)}</h3><div class="metric">进度 ${Math.round(p.progress||0)}% · ${esc(p.status||'active')}</div><div class="bar"><div style="width:${Math.min(100,Math.max(0,p.progress||0))}%"></div></div><div>${(p.spec?.tracking_fields||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div><details style="margin-top:12px"><summary>查看完整计划</summary><div class="planpre">${esc(planText(p))}</div></details><textarea class="checkin" style="min-height:90px;margin-top:12px" placeholder="汇报进度：这周做了什么、没做到什么、哪里卡住了"></textarea><button class="secondary progressBtn" style="width:100%;margin-top:8px">更新进度并调整下一步</button>${p.lastAdvice?`<div class="analysis" style="font-size:13px;margin-top:10px">${esc(p.lastAdvice)}</div>`:''}</div>`).join(''):'<div class="small">还没有计划。</div>';document.querySelectorAll('.progressBtn').forEach(btn=>btn.onclick=()=>updateProgress(btn))}
async function updateProgress(btn){const card=btn.closest('.plan'),id=card.dataset.id,text=card.querySelector('.checkin').value.trim();if(!text)return;btn.disabled=true;try{let ps=plans(),i=ps.findIndex(x=>x.id===id),p=ps[i],d=await api('/api/progress',{profile:profile(),plan:p,checkin:text,recent:entries().slice(-20)});p.progress=d.progress_percent??p.progress??0;p.lastAdvice=d.advice||'';p.updatedAt=new Date().toISOString();ps[i]=p;set(K.plans,ps);let es=entries();es.push({id:crypto.randomUUID(),time:new Date().toISOString(),text:`[计划进度] ${p.title||p.goal}：${text}`,analysis:d.advice||'',important:true});set(K.entries,es);renderPlans();renderHistory()}catch(e){alert(e.message)}finally{btn.disabled=false}}
function renderSummaries(){const a=summaries().slice().reverse();$('#summaries').innerHTML=a.length?a.slice(0,12).map(s=>`<div class="item"><div class="time">${esc(s.label)} · ${new Date(s.updatedAt).toLocaleString()}</div><div class="analysis" style="font-size:13px">${esc(s.summary)}</div>${(s.patterns||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div>`).join(''):'<div class="small">还没有阶段总结。</div>'}
function renderPending(){
 const box=$('#pendingBox'),arr=pending();
 if(!arr.length){$('#pendingCard').classList.add('hidden');return}
 $('#pendingCard').classList.remove('hidden');
 box.innerHTML=arr.map((q,i)=>`<div class="item"><div class="entry"><b>${i+1}.</b> ${esc(q.question||q)}</div>${q.reason?`<div class="small" style="margin-top:4px">${esc(q.reason)}</div>`:''}</div>`).join('');
}
function fillProfile(){const p=profile();for(const k of ['name','age','sex','height','weight','job','schedule','goals','values','notes'])$('#'+k).value=p[k]||''}
$('#saveProfile').onclick=()=>{const p={};for(const k of ['name','age','sex','height','weight','job','schedule','goals','values','notes'])p[k]=$('#'+k).value.trim();set(K.profile,p);$('#profileStatus').textContent='已保存到本机。'}
$('#send').onclick=async()=>{
 const text=$('#input').value.trim();if(!text)return;
 const b=$('#send');b.disabled=true;$('#status').textContent='正在判断信息是否足够…';$('#answerCard').classList.add('hidden');
 try{
   const h=selectHistory(text);
   const d=await api('/api/analyze',{
     profile:profile(),
     summaries:summaries().slice(-8),
     active_plans:plans().filter(p=>p.status!=='done').slice(-8),
     pending:pending(),
     mode:h.mode,
     recent:h.recent,
     relevant:h.relevant,
     text
   });
   let es=entries();
   if(d.need_clarification){
     const qs=(d.questions||[]).map(q=>typeof q==='string'?{question:q}:q);
     set(K.pending,qs);
     es.push({id:crypto.randomUUID(),time:new Date().toISOString(),text,analysis:'[待补充信息后再判断]',important:true});
     set(K.entries,es);
     $('#status').textContent='关键信息不足，Jarvis 暂停判断并向你追问。';
     $('#input').value='';
     renderPending();renderHistory();
   }else{
     set(K.pending,[]);
     es.push({id:crypto.randomUUID(),time:new Date().toISOString(),text,analysis:d.analysis||'',important:!!d.important});
     set(K.entries,es);
     $('#answer').textContent=d.analysis||'';
     $('#answerCard').classList.remove('hidden');
     $('#status').textContent=`已完成 · ${h.mode==='quick'?'快速':h.mode==='deep'?'深度':'人生级'}分析`;
     $('#input').value='';renderPending();renderHistory();
   }
 }catch(e){$('#status').textContent=e.message}finally{b.disabled=false}
}

$('#submitPending').onclick=async()=>{
 const reply=$('#pendingReply').value.trim(); if(!reply)return;
 const btn=$('#submitPending');btn.disabled=true;$('#pendingStatus').textContent='正在把你的补充信息合并进判断…';
 try{
   const qs=pending();
   const synthetic=`【对待补问题的补充回答】
${qs.map((q,i)=>`${i+1}. ${q.question||q}`).join('
')}

【用户补充】
${reply}`;
   const h=selectHistory(synthetic);
   const d=await api('/api/analyze',{
     profile:profile(),summaries:summaries().slice(-8),
     active_plans:plans().filter(p=>p.status!=='done').slice(-8),
     pending:qs,mode:'deep',recent:h.recent,relevant:h.relevant,text:synthetic,followup:true
   });
   if(d.need_clarification){
     set(K.pending,(d.questions||[]).map(q=>typeof q==='string'?{question:q}:q));
     $('#pendingStatus').textContent='还差一点关键资料，我已经保留新的待回答问题。';
     renderPending();
   }else{
     let es=entries();
     es.push({id:crypto.randomUUID(),time:new Date().toISOString(),text:synthetic,analysis:d.analysis||'',important:true});
     set(K.entries,es);set(K.pending,[]);
     $('#pendingReply').value='';renderPending();renderHistory();
     $('#answer').textContent=d.analysis||'';$('#answerCard').classList.remove('hidden');
     $('#pendingStatus').textContent='信息已补齐，已完成正式分析。';
   }
 }catch(e){$('#pendingStatus').textContent=e.message}finally{btn.disabled=false}
}

$('#createPlan').onclick=async()=>{const goal=$('#planGoal').value.trim();if(!goal)return;const b=$('#createPlan');b.disabled=true;$('#planStatus').textContent='正在拆解目标和里程碑…';try{const d=await api('/api/plan',{profile:profile(),goal,current:$('#planCurrent').value.trim(),constraints:$('#planConstraints').value.trim(),deadline:$('#planDeadline').value.trim(),time_budget:$('#planTime').value.trim(),pace:$('#planPace').value,metric:$('#planMetric').value.trim(),summaries:summaries().slice(-4)}),ps=plans();ps.push({id:crypto.randomUUID(),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),status:'active',progress:0,goal,title:d.plan_title||goal,spec:d});set(K.plans,ps);$('#planStatus').textContent='计划已创建。之后直接汇报进度即可继续调整。';renderPlans()}catch(e){$('#planStatus').textContent=e.message}finally{b.disabled=false}}
async function refreshSummary(days){const a=entries().filter(e=>(Date.now()-new Date(e.time))/86400000<=days);if(!a.length)throw new Error('这个时间范围内还没有记录');const d=await api('/api/summarize',{profile:profile(),days,entries:a.slice(-300),plans:plans().filter(p=>p.status!=='done')});let s=summaries().filter(x=>x.days!==days);s.push({days,label:`最近${days}天`,updatedAt:new Date().toISOString(),summary:d.summary||'',patterns:d.patterns||[],major_events:d.major_events||[]});set(K.summaries,s);renderSummaries()}
for(const days of [7,30,90])$('#refresh'+days).onclick=async()=>{const m=$('#memoryStatus');m.textContent=`正在更新${days}天总结…`;try{await refreshSummary(days);m.textContent='已更新。'}catch(e){m.textContent=e.message}}
$('#exportBtn').onclick=()=>{const d={version:3,exportedAt:new Date().toISOString(),profile:profile(),entries:entries(),plans:plans(),summaries:summaries(),pending:pending()},blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='jarvis-v2-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(d.profile)set(K.profile,d.profile);if(Array.isArray(d.entries))set(K.entries,d.entries);if(Array.isArray(d.plans))set(K.plans,d.plans);if(Array.isArray(d.summaries))set(K.summaries,d.summaries);if(Array.isArray(d.pending))set(K.pending,d.pending);fillProfile();renderHistory();renderPlans();renderSummaries();renderPending();renderPending();alert('导入完成')}catch(err){alert('导入失败：'+err.message)}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
fillProfile();renderHistory();renderPlans();renderSummaries();renderPending();
</script>
</body>
</html>
